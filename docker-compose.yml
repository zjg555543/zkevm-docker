version: "3.5"
networks:
  default:
    name: xlayer
services:
  erigon-stateless-executor:
    container_name: erigon-stateless-executor
    image: hermeznetwork/zkevm-prover:v6.0.2-RC3
    ports:
      - 0.0.0.0:50061:50061 # MT
      - 0.0.0.0:50071:50071 # Executor
    volumes:
      - ./config/erigon/test.stateless_executor.config.json:/usr/src/app/config.json
    command: >
      zkProver -c /usr/src/app/config.json
    depends_on:
      erigon-state-db:
        condition: service_healthy

  erigon-state-db:
    container_name: erigon-state-db
    image: postgres
    ports:
      - 5432:5432
    volumes:
      - ./config/sql/init_prover_db.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=state_user
      - POSTGRES_PASSWORD=state_password
      - POSTGRES_DB=state_db
    command:
      - "postgres"
      - "-N"
      - "500"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U state_user -d state_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
      
  erigon-seqsender:
    container_name: erigon-seqsender
    image: hermeznetwork/zkevm-seqsender:v0.1.1-RC1
    volumes:
      - ./config/sequencer.keystore:/pk/sequencer.keystore
      - ./config/erigon/seqsender.node.config.toml:/app/config.toml
      - ./config/erigon/test.genesis.config.json:/app/genesis.json
    restart: always
    command:
      - "/bin/sh"
      - "-c"
      - "/app/zkevm-seqsender run --network custom --custom-network-file /app/genesis.json --cfg /app/config.toml --components sequence-sender"

  erigon-aggregator:
    container_name: erigon-aggregator
    image: zjg555543/erigon-aggregator:v0.0.1-RC7
    ports:
      - 50081:50081
    volumes:
      - ./config/aggregator.keystore:/pk/aggregator.keystore
      - ./config/erigon/aggregator.node.config.toml:/app/config.toml
      - ./config/erigon/test.genesis.config.json:/app/genesis.json
    command:
      - "/bin/sh"
      - "-c"
      - "/app/zkevm-aggregator run --network custom --custom-network-file /app/genesis.json --cfg /app/config.toml"

  erigon-aggregator-db:
    container_name: erigon-aggregator-db
    image: postgres:15
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    ports:
      - 5434:5432
    environment:
      - POSTGRES_USER=aggregator_user
      - POSTGRES_PASSWORD=aggregator_password
      - POSTGRES_DB=aggregator_db
    command:
      - "postgres"
      - "-N"
      - "500"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aggregator_user -d aggregator_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  erigon-prover:
    container_name: erigon-prover
    image: hermeznetwork/zkevm-prover:v6.0.1
    volumes:
      - ./config/erigon/test.prover.config.json:/usr/src/app/config.json
    command: >
      zkProver -c /usr/src/app/config.json
    depends_on:
      erigon-state-db:
        condition: service_healthy

  erigon-approve:
    container_name: erigon-approve
    image: hermeznetwork/zkevm-node:v0.6.6
    volumes:
      - ./config/sequencer.keystore:/pk/keystore
      - ./config/erigon/test.node.config.toml:/app/config.toml
      - ./config/erigon/test.genesis.config.json:/app/genesis.json
    command:
      - "/bin/sh"
      - "-c"
      - "/app/zkevm-node approve --network custom --custom-network-file /app/genesis.json --key-store-path /pk/keystore --pw password --am 115792089237316195423570985008687907853269984665640564039457584007913129639935 -y --cfg /app/config.toml"

  erigon-seq:
    container_name: erigon-seq
    image: zjg555543/erigon-sequencer:v0.3.1-injected
    environment:
      - CDK_ERIGON_SEQUENCER=1
    ports:
      - 8545:8545
      - 6900:6900
    volumes:
      - ./config/erigon/test.erigon.seq.config.yaml:/usr/src/app/config.yaml
      - ./config/erigon/dynamic-mynetwork-allocs.json:/home/erigon/dynamic-configs/dynamic-mynetwork-allocs.json
      - ./config/erigon/dynamic-mynetwork-chainspec.json:/home/erigon/dynamic-configs/dynamic-mynetwork-chainspec.json
      - ./config/erigon/dynamic-mynetwork-conf.json:/home/erigon/dynamic-configs/dynamic-mynetwork-conf.json
    command: >
      cdk-erigon --http.vhosts=* --http.corsdomain=* --ws --config=/usr/src/app/config.yaml
