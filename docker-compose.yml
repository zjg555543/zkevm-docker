version: "3.5"
networks:
  default:
    name: xlayer
services:
  xlayer-l1:
    container_name: xlayer-l1
    image: hermeznetwork/geth-zkevm-contracts:elderberry-fork.9-geth1.13.11
    ports:
      - 8545:8545
      - 8546:8546
    command:
      - "--http"
      - "--http.api"
      - "admin,eth,debug,miner,net,txpool,personal,web3"
      - "--http.addr"
      - "0.0.0.0"
      - "--http.corsdomain"
      - "*"
      - "--http.vhosts"
      - "*"
      - "--ws"
      - "--ws.origins"
      - "*"
      - "--ws.addr"
      - "0.0.0.0"
      - "--dev"
      - "--dev.period"
      - "1"
      - "--datadir"
      - "/geth_data"
      - "--syncmode"
      - "full"
      - "--rpc.allow-unprotected-txs"

  xlayer-seq-fork9:
    container_name: xlayer-seq-fork9
    image: okexchain/xlayer-node:origin_release_v0.3.1_20240327061357_a142778c
    ports:
      - 9092:9091 # needed if metrics enabled
      - 6060:6060
    environment:
      - ZKEVM_NODE_STATEDB_HOST=xlayer-state-db-fork9
      - ZKEVM_NODE_POOL_DB_HOST=xlayer-pool-db-fork9
    volumes:
      - ./config/fork9/test.node.config.toml:/app/config.toml
      - ./config/fork9/test.genesis.config.json:/app/genesis.json
    command:
      - "/bin/sh"
      - "-c"
      - "/app/xlayer-node run --network custom --custom-network-file /app/genesis.json --cfg /app/config.toml --components sequencer"

  xlayer-rpc-fork9:
    container_name: xlayer-rpc-fork9
    image: okexchain/xlayer-node:origin_release_v0.3.1_20240327061357_a142778c
    ports:
      - 8123:8123
      - 8133:8133 # needed if WebSockets enabled
      - 9091:9091 # needed if metrics enabled
    environment:
      - ZKEVM_NODE_STATEDB_HOST=xlayer-state-db-fork9
      - ZKEVM_NODE_POOL_DB_HOST=xlayer-pool-db-fork9
    volumes:
      - ./config/fork9/test.node.config.toml:/app/config.toml
      - ./config/fork9/test.genesis.config.json:/app/genesis.json
    command:
      - "/bin/sh"
      - "-c"
      - "/app/xlayer-node run --network custom --custom-network-file /app/genesis.json --cfg /app/config.toml --components rpc"

  xlayer-agg-fork9:
    container_name: xlayer-agg-fork9
    image: okexchain/xlayer-node:origin_release_v0.3.1_20240327061357_a142778c
    ports:
      - 50081:50081
      - 9093:9091 # needed if metrics enabled
    environment:
      - ZKEVM_NODE_STATEDB_HOST=xlayer-state-db-fork9
      - ZKEVM_NODE_AGGREGATOR_SENDER_ADDRESS=0xBAF25C3f0e7B21818Ed922a6e01bf25CA31dE19E
    volumes:
      - ./config/fork9/test.node.config.toml:/app/config.toml
      - ./config/fork9/test.genesis.config.json:/app/genesis.json
    command:
      - "/bin/sh"
      - "-c"
      - "/app/xlayer-node run --network custom --custom-network-file /app/genesis.json --cfg /app/config.toml --components aggregator"

  xlayer-sync-fork9:
    container_name: xlayer-sync-fork9
    image: okexchain/xlayer-node:origin_release_v0.3.1_20240327061357_a142778c
    ports:
      - 9095:9091 # needed if metrics enabled
    environment:
      - ZKEVM_NODE_STATEDB_HOST=xlayer-state-db-fork9
    volumes:
      - ./config/fork9/test.node.config.toml:/app/config.toml
      - ./config/fork9/test.genesis.config.json:/app/genesis.json
    command:
      - "/bin/sh"
      - "-c"
      - "/app/xlayer-node run --network custom --custom-network-file /app/genesis.json --cfg /app/config.toml --components synchronizer"

  xlayer-executor-fork9:
    container_name: xlayer-executor-fork9
    image: okexchain/xlayer-prover:origin_release_v0.3.1_20240327061504_458b8d26
    ports:
      - 50061:50061 # MT
      - 50071:50071 # Executor
    volumes:
      - ./config/fork9/test.executor.config.json:/usr/src/app/config.json
    command: >
      zkProver -c /usr/src/app/config.json

  xlayer-prover-fork9:
    container_name: xlayer-prover-fork9
    image: okexchain/xlayer-prover:origin_release_v0.3.1_20240327061504_458b8d26
    volumes:
      - ./config/fork9/test.prover.config.json:/usr/src/app/config.json
    command: >
      zkProver -c /usr/src/app/config.json

  xlayer-tm-fork9:
    container_name: xlayer-tm-fork9
    image: okexchain/xlayer-node:origin_release_v0.3.1_20240327061357_a142778c
    ports:
      - 9094:9091 # needed if metrics enabled
    environment:
      - ZKEVM_NODE_STATEDB_HOST=xlayer-state-db-fork9
    volumes:
      - ./keys/sequencer.keystore:/pk/sequencer.keystore
      - ./keys/aggregator.keystore:/pk/aggregator.keystore
      - ./config/fork9/test.node.config.toml:/app/config.toml
      - ./config/fork9/test.genesis.config.json:/app/genesis.json
    command:
      - "/bin/sh"
      - "-c"
      - "/app/xlayer-node run --network custom --custom-network-file /app/genesis.json --cfg /app/config.toml --components eth-tx-manager"

  xlayer-seqs-fork9:
    container_name: xlayer-seqs-fork9
    image: okexchain/xlayer-node:origin_release_v0.3.1_20240327061357_a142778c
    environment:
      - ZKEVM_NODE_STATEDB_HOST=xlayer-state-db-fork9
      - ZKEVM_NODE_POOL_DB_HOST=xlayer-pool-db-fork9
      - ZKEVM_NODE_SEQUENCER_SENDER_ADDRESS=0x28E803c70B44BA4ec2b27fa8b53DFd33d1b9c9b1
    volumes:
      - ./keys/sequencer.keystore:/pk/sequencer.keystore
      - ./config/fork9/test.node.config.toml:/app/config.toml
      - ./config/fork9/test.genesis.config.json:/app/genesis.json
    command:
      - "/bin/sh"
      - "-c"
      - "/app/xlayer-node run --network custom --custom-network-file /app/genesis.json --cfg /app/config.toml --components sequence-sender"

  xlayer-gp-fork9:
    container_name: xlayer-gp-fork9
    image: okexchain/xlayer-node:origin_release_v0.3.1_20240327061357_a142778c
    environment:
      - ZKEVM_NODE_POOL_DB_HOST=xlayer-pool-db
    volumes:
      - ./keys/sequencer.keystore:/pk/keystore
      - ./config/fork9/test.node.config.toml:/app/config.toml
      - ./config/fork9/test.genesis.config.json:/app/genesis.json
    command:
      - "/bin/sh"
      - "-c"
      - "/app/xlayer-node run --network custom --custom-network-file /app/genesis.json --cfg /app/config.toml --components l2gaspricer"

  xlayer-da-fork9:
    container_name: xlayer-da-fork9
    image: okexchain/xlayer-data-availability:origin_release_v0.3.1_20240327061508_f84bdab
    ports:
      - 8444:8444
    volumes:
      - ./config/fork9/test.da.toml:/app/config.toml
      - ./config/test-member.keystore:/pk/test-member.keystore
    command:
      - "/bin/sh"
      - "-c"
      - "/app/xlayer-data-availability run --cfg /app/config.toml"

  xlayer-state-db-fork9:
    container_name: xlayer-state-db-fork9
    image: postgres
    ports:
      - 5432:5432
    volumes:
      - ./sql/init_prover_db.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=state_user
      - POSTGRES_PASSWORD=state_password
      - POSTGRES_DB=state_db
    command:
      - "postgres"
      - "-N"
      - "500"

  xlayer-pool-db-fork9:
    container_name: xlayer-pool-db-fork9
    image: postgres
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=pool_user
      - POSTGRES_PASSWORD=pool_password
      - POSTGRES_DB=pool_db
    command:
      - "postgres"
      - "-N"
      - "500"

  xlayer-event-db-fork9:
    container_name: xlayer-event-db-fork9
    image: postgres
    ports:
      - 5435:5432
    volumes:
      - ./sql/init_event_db.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=event_user
      - POSTGRES_PASSWORD=event_password
      - POSTGRES_DB=event_db
    command:
      - "postgres"
      - "-N"
      - "500"
  
  xlayer-seq-fork13:
    container_name: xlayer-seq-fork13
    image: cdk-erigon
    environment:
      - CDK_ERIGON_SEQUENCER=1
    ports:
      - 8123:8545
      - 6900:6900
    volumes:
      - ./config/fork13/test.erigon.seq.config.yaml:/usr/src/app/config.yaml
      - ./config/fork13/dynamic-mynetwork-allocs.json:/usr/src/app/dynamic-mynetwork-allocs.json
      - ./config/fork13/dynamic-mynetwork-chainspec.json:/usr/src/app/dynamic-mynetwork-chainspec.json
      - ./config/fork13/dynamic-mynetwork-conf.json:/usr/src/app/dynamic-mynetwork-conf.json
    command: >
      cdk-erigon --http.vhosts=* --http.corsdomain=* --ws --config=/usr/src/app/config.yaml

  xlayer-rpc-fork13:
    container_name: xlayer-rpc-fork13
    image: cdk-erigon
    environment:
      - CDK_ERIGON_SEQUENCER=0
    ports:
      - 8124:8545
      - 6901:6900
      - 9091:9095
    volumes:
      - ./config/fork13/test.erigon.rpc.config.yaml:/usr/src/app/config.yaml
      - ./config/fork13/dynamic-mynetwork-allocs.json:/usr/src/app/dynamic-mynetwork-allocs.json
      - ./config/fork13/dynamic-mynetwork-chainspec.json:/usr/src/app/dynamic-mynetwork-chainspec.json
      - ./config/fork13/dynamic-mynetwork-conf.json:/usr/src/app/dynamic-mynetwork-conf.json
    command: >
      cdk-erigon --http.vhosts=* --http.corsdomain=* --ws --config=/usr/src/app/config.yaml

  xlayer-executor-fork13:
    container_name: xlayer-executor-fork13
    image: hermeznetwork/zkevm-prover:v6.0.2-RC3
    ports:
      - 0.0.0.0:50061:50061 # MT
      - 0.0.0.0:50071:50071 # Executor
    volumes:
      - ./config/fork13/test.stateless_executor.config.json:/usr/src/app/config.json
    command: >
      zkProver -c /usr/src/app/config.json

  xlayer-state-db-fork13:
    container_name: xlayer-state-db-fork13
    image: postgres
    ports:
      - 5432:5432
    volumes:
      - ./sql/init_prover_db.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=state_user
      - POSTGRES_PASSWORD=state_password
      - POSTGRES_DB=state_db
    command:
      - "postgres"
      - "-N"
      - "500"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U state_user -d state_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
      
  xlayer-seqs-fork13:
    container_name: xlayer-seqs-fork13
    image: zjg555543/cdk:v0.4.0-beta5
    volumes:
      - ./keys/test-member.keystore:/pk/test-member.keystore
      - ./keys/sequencer.keystore:/pk/sequencer.keystore
      - ./config/fork13/cdk.config.toml:/app/config.toml
      - ./config/fork13/test.genesis.config.json:/app/genesis.json
    command:
      - "/bin/sh"
      - "-c"
      - "/usr/local/bin/cdk-node run --cfg /app/config.toml --custom-network-file /app/genesis.json --components sequence-sender"

  xlayer-agg-fork13:
    container_name: xlayer-agg
    image: zjg555543/cdk:v0.4.0-beta5
    ports:
      - 50081:50081
    volumes:
      - ./keys/aggregator.keystore:/pk/aggregator.keystore
      - ./config/fork13/cdk.config.toml:/app/config.toml
      - ./config/fork13/test.genesis.config.json:/app/genesis.json
    command:
      - "/bin/sh"
      - "-c"
      - "/usr/local/bin/cdk-node run --cfg /app/config.toml --custom-network-file /app/genesis.json  --components aggregator"

  xlayer-agg-db-fork13:
    container_name: xlayer-agg-db-fork13
    image: postgres:15
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    ports:
      - 5434:5432
    environment:
      - POSTGRES_USER=aggregator_user
      - POSTGRES_PASSWORD=aggregator_password
      - POSTGRES_DB=aggregator_db
    command:
      - "postgres"
      - "-N"
      - "500"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aggregator_user -d aggregator_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  xlayer-prover-fork13:
    container_name: xlayer-prover-fork13
    image: hermeznetwork/zkevm-prover:v6.0.1
    volumes:
      - ./config/fork13/test.prover.config.json:/usr/src/app/config.json
    command: >
      zkProver -c /usr/src/app/config.json

  xlayer-approve:
    container_name: xlayer-approve
    image: hermeznetwork/zkevm-node:v0.6.6
    volumes:
      - ./keys/sequencer.keystore:/pk/keystore
      - ./config/fork9/test.node.config.toml:/app/config.toml
      - ./config/fork9/test.genesis.config.json:/app/genesis.json
    command:
      - "/bin/sh"
      - "-c"
      - "/app/zkevm-node approve --network custom --custom-network-file /app/genesis.json --key-store-path /pk/keystore --pw password --am 115792089237316195423570985008687907853269984665640564039457584007913129639935 -y --cfg /app/config.toml"

  xlayer-da-db:
    container_name: xlayer-da-db
    image: postgres
    ports:
      - 5437:5432
    environment:
      - POSTGRES_USER=committee_user
      - POSTGRES_PASSWORD=committee_password
      - POSTGRES_DB=committee_db
    command:
      - "postgres"
      - "-N"
      - "500"

  xlayer-bridge:
    container_name: xlayer-bridge
    image: okexchain/xlayer-bridge-service:origin_release_v0.3.1_20240327061437_87e3340
    ports:
      - 8080:8080
      - 9090:9090
    environment:
      - ZKEVM_BRIDGE_DATABASE_USER=test_user
      - ZKEVM_BRIDGE_DATABASE_PASSWORD=test_password
      - ZKEVM_BRIDGE_DATABASE_NAME=test_db
      - ZKEVM_BRIDGE_DATABASE_HOST=xlayer-bridge-db
      - ZKEVM_BRIDGE_DATABASE_PORT=5432
    volumes:
      - ./keys/test.keystore.claimtx:/pk/keystore.claimtxmanager
      - ./config/fork9/config.bridge.toml:/app/config.toml
      - ./config/root-ca-cert:/app/root-ca-cert
    command:
      - "/bin/sh"
      - "-c"
      - "/app/xlayer-bridge run --cfg /app/config.toml"

  xlayer-bridge-db:
    container_name: xlayer-bridge-db
    image: postgres
    expose:
      - 5436
    ports:
      - 5434:5432
    environment:
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - POSTGRES_DB=test_db
    command: [ "postgres", "-N", "500" ]

  xlayer-bridge-redis:
    container_name: xlayer-bridge-redis
    image: redis
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    expose:
      - 6379
    ports:
      - 6379:6379
    environment:
      - REDIS_PASSWORD=my_password
      - REDIS_PORT=6379
      - REDIS_DATABASES=8

  xlayer-bridge-ui:
    container_name: xlayer-bridge-ui
    image: hermeznetwork/zkevm-bridge-ui:latest
    ports:
      - 8090:80
    environment:
      - ETHEREUM_RPC_URL=http://127.0.0.1:8545
      - ETHEREUM_EXPLORER_URL=http://127.0.0.1:4000
      - ETHEREUM_ROLLUP_MANAGER_ADDRESS="XXX"
      - ETHEREUM_BRIDGE_CONTRACT_ADDRESS="XXX"
      - ETHEREUM_FORCE_UPDATE_GLOBAL_EXIT_ROOT=true
      - ETHEREUM_PROOF_OF_EFFICIENCY_CONTRACT_ADDRESS="XXX"
      - POLYGON_ZK_EVM_RPC_URL=http://127.0.0.1:8123
      - POLYGON_ZK_EVM_EXPLORER_URL=http://127.0.0.1:4001
      - POLYGON_ZK_EVM_BRIDGE_CONTRACT_ADDRESS="XXX"
      - POLYGON_ZK_EVM_NETWORK_ID=1
      - BRIDGE_API_URL=http://127.0.0.1:8080
      - ENABLE_FIAT_EXCHANGE_RATES=false
      - ENABLE_OUTDATED_NETWORK_MODAL=false
      - ENABLE_DEPOSIT_WARNING=true
      - ENABLE_REPORT_FORM=false
      - USE_FIAT_EXCHANGE_RATES=false
      - SHOW_OUTDATED_NETWORK_MODAL=false

  xlayer-bridge-kafka:
    image: wurstmeister/kafka
    container_name: xlayer-bridge-kafka
    expose:
      - 9092
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://:9092,OUTSIDE://localhost:9123
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:9123
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: kafka-zookeeper:2181
      KAFKA_CREATE_TOPICS: "explorer_chainAddressPrice_push:1:1"

  kafka-zookeeper:
    image: wurstmeister/zookeeper
    container_name: kafka-zookeeper
    ports:
      - "2181:2181"
    expose:
      - 2181
